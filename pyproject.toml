[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtm"
version = "0.1.0"
description = "Dense-to-MoE conversion utilities for Qwen-style models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
dtm-convert = "dtm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

